<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase II — Zero-Shot Digit OBB Review</title>
<style>
*{box-sizing:border-box}body{font:15px system-ui,sans-serif;color:#1b2b42;background:#f3f6fa;margin:0}header{background:#142841;color:white;padding:22px 4vw}h1{font-size:1.5rem;margin:0 0 5px}header p{margin:4px 0;color:#d6e2ef}main{max-width:1350px;margin:auto;padding:20px}.notice{background:#fff0c5;padding:12px;border-radius:6px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0}.images{display:grid;grid-template-columns:1fr 1fr;gap:14px}figure{margin:0;background:white;border:1px solid #ccd6e3;padding:14px;border-radius:8px}figcaption{font-weight:700;margin-bottom:12px}img{width:100%;height:200px;object-fit:contain;background:#f0f2f6;image-rendering:auto}.meta,.review{background:white;border:1px solid #ccd6e3;border-radius:8px;padding:14px;margin-top:14px}.predictions{line-height:1.7;word-break:break-word}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}button,select,textarea{font:inherit}button,select{padding:9px 13px;border:1px solid #a5b5ca;border-radius:6px;background:white;color:#18283e;cursor:pointer}button.selected{background:#dcecff;border-color:#2467ac}.primary{background:#185e9e;color:white}textarea{width:100%;min-height:75px;padding:8px;border:1px solid #a5b5ca;border-radius:5px}small{color:#526681}@media(max-width:700px){.images{grid-template-columns:1fr}}
</style></head><body><header><h1>Phase II — Zero-Shot Digit OBB Review</h1><p>Judge localization, not the number of physical digit slots or digit-reading accuracy.</p></header>
<main><div class="notice">Export your review regularly. Browser storage for local files can be cleared or unavailable.</div>
<div class="top"><strong id="sample"></strong><span id="progress"></span><label>Filter: <select id="filter"><option value="all">All samples</option><option value="unreviewed">Unreviewed</option><option value="good">Good</option><option value="partial">Partial</option><option value="failed">Failed</option></select></label></div>
<div class="images"><figure><figcaption>Rectified register input</figcaption><img id="input" alt="Rectified register"></figure><figure><figcaption>Predicted digit OBBs</figcaption><img id="overlay" alt="Register with predicted oriented boxes"></figure></div>
<section class="meta"><strong>Predictions</strong> <span id="box-count"></span> <small>Numbers match the overlay labels.</small><div class="predictions" id="predictions"></div><small id="scenarios"></small></section>
<section class="review"><strong>Manual localization review</strong><div class="actions"><button id="good">Good localization</button><button id="partial">Partial localization</button><button id="failed">Failed localization</button><button id="clear">Clear review</button></div><label for="notes">Optional notes (missed glyphs, duplicate boxes, corners, transitions, etc.)</label><textarea id="notes"></textarea></section>
<div class="actions"><button id="previous">← Previous</button><button id="next">Next →</button><button id="next-unreviewed">Next unreviewed</button><button id="export" class="primary">Export Review JSON</button><button id="import-button">Import Review JSON</button><input id="import-file" type="file" accept="application/json,.json" hidden></div><small id="storage"></small>
</main><script id="review-data" type="application/json">__DATA__</script>
<script>
(()=>{'use strict';const rows=JSON.parse(document.getElementById('review-data').textContent).samples;const $=id=>document.getElementById(id);const key='phase2-exp0-review-v1';let state={},index=0,storage=true;
try{let x=JSON.parse(localStorage.getItem(key)||'{}');for(const [id,v] of Object.entries(x))if(rows.some(r=>r.sample_id===id)&&['good','partial','failed',null].includes(v.verdict)&&typeof v.notes==='string')state[id]=v}catch(_){storage=false}
function save(){try{localStorage.setItem(key,JSON.stringify(state));storage=true}catch(_){storage=false}$('storage').textContent=storage?'Browser autosave available; export a JSON backup.':'Browser autosave unavailable; export JSON to save progress.'}
function current(){return state[rows[index].sample_id]||{verdict:null,notes:'',timestamp:null}}
function render(){let r=rows[index],v=current(),counts={good:0,partial:0,failed:0};for(const x of Object.values(state))if(x.verdict)counts[x.verdict]++;$('sample').textContent=`${r.sample_id} — ${index+1} / ${rows.length}`;$('progress').textContent=`Reviewed ${counts.good+counts.partial+counts.failed}/100 • Good ${counts.good} • Partial ${counts.partial} • Failed ${counts.failed}`;$('input').src='../'+r.input_image;$('overlay').src='../'+r.visualization;$('box-count').textContent=`(${r.box_count} boxes)`;$('predictions').textContent=r.detections.length?r.detections.map((d,i)=>`#${i+1}: ${d.class_name} (${d.confidence.toFixed(3)})`).join('  ·  '):'No boxes';$('scenarios').textContent='Source scenario flags: '+Object.entries(r.scenario_labels).filter(([,v])=>v).map(([k])=>k).join(', ');$('notes').value=v.notes;for(const k of ['good','partial','failed'])$(k).classList.toggle('selected',v.verdict===k);$('storage').textContent=storage?'Browser autosave available; export a JSON backup.':'Browser autosave unavailable; export JSON to save progress.'}
function update(changes){let id=rows[index].sample_id;state[id]={...current(),...changes,timestamp:new Date().toISOString()};save();render()}
function eligible(i){let f=$('filter').value,v=(state[rows[i].sample_id]||{}).verdict;return f==='all'||(f==='unreviewed'?!v:v===f)}
function move(step,unreviewed=false){for(let n=1;n<=rows.length;n++){let i=(index+step*n+rows.length*2)%rows.length;if(unreviewed?!(state[rows[i].sample_id]||{}).verdict:eligible(i)){index=i;render();return}}}
for(const k of ['good','partial','failed'])$(k).onclick=()=>update({verdict:k});$('clear').onclick=()=>{if(confirm('Clear this review?'))update({verdict:null})};$('notes').oninput=e=>{let id=rows[index].sample_id;state[id]={...current(),notes:e.target.value,timestamp:new Date().toISOString()};save()};$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('next-unreviewed').onclick=()=>move(1,true);$('filter').onchange=()=>{if(!eligible(index))move(1);else render()};
$('export').onclick=()=>{const payload={schema:'phase2-exp0-review-v1',reviewed_at:new Date().toISOString(),samples:rows.map(r=>({sample_id:r.sample_id,verdict:(state[r.sample_id]||{}).verdict||null,notes:(state[r.sample_id]||{}).notes||'',timestamp:(state[r.sample_id]||{}).timestamp||null}))};let url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='phase2_exp0_manual_review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import-button').onclick=()=>$('import-file').click();$('import-file').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let x=JSON.parse(await file.text());if(x.schema!=='phase2-exp0-review-v1'||!Array.isArray(x.samples)||x.samples.length!==rows.length)throw Error('Invalid review file');let next={},seen=new Set();for(const v of x.samples){if(!rows.some(r=>r.sample_id===v.sample_id)||seen.has(v.sample_id)||![null,'good','partial','failed'].includes(v.verdict)||typeof v.notes!=='string')throw Error('Invalid sample or verdict');seen.add(v.sample_id);next[v.sample_id]={verdict:v.verdict,notes:v.notes,timestamp:v.timestamp}}if(Object.keys(state).length&&!confirm('Replace current review with the imported file?'))return;state=next;save();render()}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}};render()})();
</script></body></html>
